[package]
name = "luxury-tui"
version = "0.1.0"
edition = "2021"
description = "A fast, terminal-native Kubernetes cluster manager. A TUI companion inspired by Luxury Yacht."
authors = ["Luxury TUI contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/luxury-tui/luxury-tui"
readme = "README.md"

[lib]
name = "luxury_tui"
path = "src/lib.rs"

[[bin]]
name = "luxury-tui"
path = "src/main.rs"

[dependencies]
# Terminal UI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-tree-widget = "0.22"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-util = "0.7"

# Kubernetes
kube = { version = "0.98", features = ["client", "config", "runtime", "ws"] }
k8s-openapi = { version = "0.24", features = ["latest"] }

# Error handling / logging
color-eyre = "0.6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Data / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }

# UX niceties
fuzzy-matcher = "0.3"
similar = "2"
unicode-width = "0.2"
directories = "5"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
